# Deploy no Render (https://render.com): New + > Blueprint > escolha este repositório.
# Os arquivos e o backup do banco ficam no Google Drive compartilhado da Spec,
# então o servidor não precisa de disco persistente. Guia: docs/GOOGLE-DRIVE.md
services:
  - type: web
    name: spec-studio
    runtime: docker
    plan: standard          # 2 GB RAM: renders de vídeo precisam de memória
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_EMAIL
        sync: false         # e-mail do primeiro administrador
      - key: ADMIN_PASSWORD
        sync: false         # senha inicial do administrador (troque depois em "Minha conta")
      - key: DRIVE_ID
        sync: false         # ID do Drive compartilhado "Spec Studio"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false         # conteúdo do arquivo .json da chave da conta de serviço
      - key: SPEC_EMAIL_DOMAIN
        sync: false         # opcional: só aceita e-mails deste domínio (deixe vazio para aceitar qualquer e-mail)
      - key: ANTHROPIC_API_KEY
        sync: false         # opcional: ativa o Assistente IA com as skills
      - key: UPLOAD_MAX_MB
        value: "4096"
